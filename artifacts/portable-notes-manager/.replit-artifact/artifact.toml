kind = "web"
previewPath = "/"
title = "Portable Notes Manager"
description = "A straightforward student notes manager for creating, editing, searching, and deleting notes, backed by a portable PostgreSQL REST API that can run in Replit or on-premises."
version = "1.0.0"
id = "artifacts/portable-notes-manager"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21447

[services.development]
run = "pnpm --filter @workspace/portable-notes-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/portable-notes-manager", "run", "build" ]
serve = "static"
publicDir = "artifacts/portable-notes-manager/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21447"
BASE_PATH = "/"
